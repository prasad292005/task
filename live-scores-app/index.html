<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboScore - Live Sports</title>
    <!-- Google Fonts for Premium Look -->
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-content">
            <div class="logo">
                <i class="fa-solid fa-gauge-high"></i> TURBO<span class="highlight">SCORE</span>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active">Live Matches</a></li>
                <li><a href="#">Leagues</a></li>
                <li><a href="#">News</a></li>
                <li><a href="#">Stats</a></li>
            </ul>
            <div class="user-actions">
                <button class="btn btn-outline">Login</button>
                <button class="btn btn-primary">Go Premium</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="container hero-content">
            <div class="match-spotlight">
                <div class="live-tag">LIVE NOW <span class="blink">●</span></div>
                <div class="teams-large">
                    <div class="team">
                        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png"
                            alt="Real Madrid" class="team-logo-lg">
                        <span class="team-name">Real Madrid</span>
                    </div>
                    <div class="score-display">
                        <span id="spotlight-score-home">2</span>
                        <span class="divider">:</span>
                        <span id="spotlight-score-away">1</span>
                    </div>
                    <div class="team">
                        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/4/47/FC_Barcelona_%28crest%29.svg/1200px-FC_Barcelona_%28crest%29.svg.png"
                            alt="Barcelona" class="team-logo-lg">
                        <span class="team-name">Barcelona</span>
                    </div>
                </div>
                <div class="match-meta">
                    <i class="fa-regular fa-clock"></i> <span id="spotlight-time">72'</span> • La Liga • Bernabéu
                </div>
            </div>
        </div>
    </header>

    <!-- Main Score Grid -->
    <main class="container main-content">
        <div class="section-header">
            <h2><i class="fa-solid fa-list-ul"></i> Live Matches</h2>
            <div class="filters">
                <button class="filter-btn active">All</button>
                <button class="filter-btn">Premier League</button>
                <button class="filter-btn">Serie A</button>
                <button class="filter-btn">Bundesliga</button>
            </div>
        </div>

        <div class="score-grid" id="score-container">
            <!-- Matches will be injected here via JS -->
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2024 TurboScore Inc. The #1 destination for speed and stats.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
